[package]
name = "plx_jellyfin"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative Jellyfin bridge: a loopback server that answers the Plex Media Server subset the app speaks, backed by a Jellyfin server."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

# The crate's root is module `jellyfin` of the application's module tree (ci/module_graph.py
# `split_mounts`), so ci/module-layers.ini places it as one member, `jellyfin`.
[package.metadata.plx]
mount = "jellyfin"

[lib]
name = "plx_jellyfin"
# An rlib the application crate links, like every other layer crate (ci/test_no_host_staticlib.py).
crate-type = ["rlib"]

[features]
default = []
devtriggers = ["plx_base/devtriggers", "plx_net/devtriggers"]
hostsim = ["plx_base/hostsim"]

[dependencies]
plx_base = { path = "../base" }
plx_net = { path = "../net" }
qrcodegen = "=1.8.0"
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[lints]
workspace = true
